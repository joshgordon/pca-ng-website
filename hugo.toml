baseURL = "https://example.com"
languageCode = "en-us"
title = "PCA NextGen Conference 2026"

disableKinds = ["taxonomy", "term", "RSS", "sitemap"]
# Build into _site, the output directory Cloudflare Pages already uses
publishDir = "_site"

[params]
  description = "Important links and info for PCA's NextGen conference"
  favicon = "/assets/favicon.svg"
  locale = "en_US"
  tagline = ""
  # ga4 = "G-XXXXXXX"

  [params.badge]
    enable = false
    icon = "ri:verified-badge-fill"
    color = "#dfb221"
[minify]
minifyOutput = true
