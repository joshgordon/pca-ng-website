<script>
  // Bring a linked room (#banquet etc.) into view, centred inside the scrollable map on phones.
  (function () {
    function showRoom() {
      var id = decodeURIComponent(location.hash.slice(1));
      var room = id && document.getElementById(id);
      if (!room || !room.classList.contains("room")) return;
      var box = document.querySelector(".map-scroll");
      var r = room.getBoundingClientRect(), b = box.getBoundingClientRect();
      box.scrollLeft += r.left + r.width / 2 - (b.left + b.width / 2);
      document.querySelector(".commons-map").scrollIntoView({ block: "center" });
    }
    window.addEventListener("hashchange", showRoom);
    window.addEventListener("load", showRoom);
  })();
</script>
