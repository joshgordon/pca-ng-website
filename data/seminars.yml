- slot: "10:30"
  seminars:
    - title: Praying Through Psalm 23
      speakers:
        - David Kelly - New Hope Presbyterian Church, Eustis, FL
      location: The Chapel
      description: >-
        Join David as he lead us through Psalm 23 devotionally. This is meant to be a time of refreshment and
        an opportunity to feed together on God's Word. Please join us as we let the word of God dwell richly in
        our hearts together and teach us and instruct us and train us to do what He has called us to do.

    - title: "Better Together: Children’s and Student Ministry Partnership"
      short: "Better together: Children’s and Youth Min Partnership"
      speakers:
        - Katie Flores - CDM Children’s Ministry Coordinator, Birmingham, AL
        - Katie Gordon - CDM Student Ministries Administrator, Millersville, MD
      location: Room 209/210
      description: >-
        Children’s and student ministries have different rhythms and challenges—but a shared mission to help
        young people love Jesus. This session explores practical ways to strengthen connection,
        communication, and collaboration between CM and SM, so together we can disciple kids and students
        with greater unity and purpose.

    - title: Connecting Students to the Truth
      speakers:
        - Matt Hedinger - Village Seven Presbyterian Church, Colorado Springs, CO
      location: Youth Room
      description: >-
        This is a condensed version of certification class on teaching. This seminar helps give us a framework for
        preparing lessons for students as well as some techniques while teaching.

- slot: "11:30"
  seminars:
    - title: Sitting at the Feet of Jesus
      speakers:
        - Christian Graham - SeeJesus Ministry
      location: The Chapel
      description: >-
        Sitting at the feet of Jesus with your students. Our heart’s desire is for each student to develop a deep
        passion for Jesus. Using Mary’s devotion in Scripture—her choice to sit at Jesus’ feet—serves as a
        powerful example. We will reflect on Mary’s love for Christ and explore how to cultivate a similar spirit of
        attentive discipleship, learning not only to sit at His feet in worship and devotion, but also how to guide
        others to do the same.

    - title: Building Relationships with Your Elders, Coworkers, and Parents
      speakers:
        - Stephen Estock - CDM Coordinator, Lawrenceville, GA
      location: Room 209/210
      description: >-
        Every interaction in the church is a mix of interests and expectations. How do we navigate those
        interactions, especially when we feel insecure? The session will consider the power dynamics present
        and how we can communicate with others in ways that build trust.

    - title: "Navigating Gender Identity: Walking Alongside Students with Truth, Grace, and the Hope of the Gospel"
      speakers:
        - Steve Dallwig - Chapelgate Presbyterian Church, Marriottsville, MD
      location: Youth Room
      description: >-
        Gender identity is one of the most confusing issues our students face today. The world has created
        categories and narratives that distort God’s good design, and our students are being shaped by those
        influences daily. This seminar will help you understand the pressures they face, shepherd them with
        compassion and clarity, and equip your ministry to respond with both biblical truth, love and practical
        guidance.

- slot: "1:30"
  seminars:
    - title: Optimizing Games and Student Leadership
      speakers:
        - Tim Malone - Cornerstone Presbyterian Church, Landenberg, PA
        - David Kelly - New Hope Presbyterian Church, Eustis, FL
      location: The Chapel
      description: >-
        Do these two go together? Absolutely not! But wait – yes they can work together! David Kelly and Tim
        Malone will work together to bring you a long list of games, some how tos, and then move the discussion
        to growing student leadership!! All in one hour!!

    - title: Let Jesus Shepherd Your Heart
      speakers:
        - Mikey Puckett - Seven Rivers Church, Lecanto, FL
      location: Room 209/210
      description: >-
        Student ministry is a beautiful calling—but it’s easy to love the work more than the One who called you.
        When our identity depends on students’ responses instead of Christ’s grace, we lose our way. This
        seminar invites you to rediscover the Good Shepherd who pursues your heart first. Before you can
        shepherd others well, you must let Him shepherd you.

    - title: "Walking Through the Valley with the Anxious Generation: Helping Students Face Fear with Faith in a World of Rising Anxiety"
      short: Walking through the Valley with the Anxious Generation
      speakers:
        - Tonya Cherry - Counselor, Marriottsville, MD
      location: Youth Room
      description: >-
        Today’s teens are more anxious than ever, and youth pastors are often on the front lines. This seminar
        offers practical strategies for entering into honest, hope-filled conversations with students who are
        struggling. We’ll explore ways to respond with empathy, create safe spaces, and remind them that Jesus
        walks with them—even when the path feels dark.
